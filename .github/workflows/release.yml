name: Create Release Package

on:
  push:
    paths:
      - 'VERSION'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create zip file
        run: |
          zip -r ascent-assets-${{ steps.version.outputs.version }}.zip . \
            -x "LICENSE.md" "VERSION" ".git/*" ".github/*" "*.zip"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ascent-Assets.v${{ steps.version.outputs.version }}.zip
          tag_name: v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
